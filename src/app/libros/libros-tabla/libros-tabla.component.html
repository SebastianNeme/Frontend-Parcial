<table>
  <thead>
    <tr>
      <th scope="col">Título</th>
      <th scope="col">Autor</th>
      <th scope="col">Año</th>
      <th scope="col">Biblioteca</th>
    </tr>
  </thead>
  <tbody>
    @for (libro of libros; track libro.id) {
      <tr>
        <td>{{ libro.titulo }}</td>
        <td>{{ libro.autor }}</td>
        <td>{{ libro.publicacion }}</td>
        <td>{{ libro.biblioteca }}</td>
      </tr>
    }
  </tbody>
</table>
